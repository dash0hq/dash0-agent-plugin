name: E2E Release Verification

# The full published-release flow: claude-on-event.sh downloads the real binary
# from GitHub Releases, is invoked with events, and a mock OTLP server checks
# what arrives. Does NOT run on push to main — the binary does not exist until a
# release is cut.
#
# Called by the Release workflow once it has published. It used to listen on
# `release: [published]` instead, which never fired: GoReleaser creates the
# release with GITHUB_TOKEN, and events raised by GITHUB_TOKEN do not start
# workflow runs. Across 13 releases this job ran zero times on that trigger.

on:
  workflow_call:
    inputs:
      version:
        description: 'Release to exercise. Empty falls back to the version pinned in the checkout.'
        type: string
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: 'Release to exercise, e.g. 0.1.25. Empty uses the pinned version.'
        type: string
        required: false

jobs:
  e2e-release:
    runs-on: ubuntu-latest
    env:
      # Steers the bootstrap at the release under test. Empty leaves the pinned
      # default in place, which is what a bare manual dispatch wants.
      DASH0_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build mock OTLP server
        run: make build-binary PKG=./test/e2e/mock-otlp-server OUT=/tmp/mock-otlp

      - name: Start mock OTLP server
        run: |
          /tmp/mock-otlp &
          sleep 1
          echo "Mock OTLP server started on :4319"

      - name: Run claude-on-event.sh with SessionStart
        env:
          CLAUDE_PLUGIN_DATA: /tmp/e2e-plugin-data
          DASH0_OTLP_URL: http://localhost:4319
          CLAUDE_PLUGIN_OPTION_OTLP_URL: http://localhost:4319
          CLAUDE_PLUGIN_OPTION_AUTH_TOKEN: e2e-release-test-token
        run: |
          mkdir -p "$CLAUDE_PLUGIN_DATA"
          echo '{"hook_event_name":"SessionStart","session_id":"e2e-release-test","model":"opus"}' | \
            bash claude/claude-on-event.sh
          echo "claude-on-event.sh completed"

      - name: Run claude-on-event.sh with full turn
        env:
          CLAUDE_PLUGIN_DATA: /tmp/e2e-plugin-data
          DASH0_OTLP_URL: http://localhost:4319
          CLAUDE_PLUGIN_OPTION_OTLP_URL: http://localhost:4319
          CLAUDE_PLUGIN_OPTION_AUTH_TOKEN: e2e-release-test-token
        run: |
          echo '{"hook_event_name":"UserPromptSubmit","session_id":"e2e-release-test","prompt":"hello"}' | \
            bash claude/claude-on-event.sh
          echo '{"hook_event_name":"PostToolUse","session_id":"e2e-release-test","tool_name":"Bash","tool_use_id":"tu1","duration_ms":100}' | \
            bash claude/claude-on-event.sh
          echo '{"hook_event_name":"Stop","session_id":"e2e-release-test","model":"opus","stop_reason":"end_turn"}' | \
            bash claude/claude-on-event.sh
          echo "Full turn completed"

      - name: Verify mock received requests
        run: |
          sleep 2
          RESULT=$(curl -s http://localhost:4319/requests)
          echo "Requests received:"
          echo "$RESULT" | jq .
          COUNT=$(echo "$RESULT" | jq '.count')
          if [ "$COUNT" -lt 3 ]; then
            echo "::error::Expected at least 3 requests (connectivity check + tool span + chat span), got $COUNT"
            exit 1
          fi
          # Verify auth header was sent on at least one request
          HAS_AUTH=$(echo "$RESULT" | jq '[.requests[] | select(.auth == "Bearer e2e-release-test-token")] | length')
          if [ "$HAS_AUTH" -lt 1 ]; then
            echo "::error::No request had the expected auth header"
            exit 1
          fi
          echo "E2E release verification passed ($COUNT requests received, $HAS_AUTH with auth)"

      - name: Verify binary was downloaded (not pre-existing)
        env:
          CLAUDE_PLUGIN_DATA: /tmp/e2e-plugin-data
        run: |
          ls -la "$CLAUDE_PLUGIN_DATA/bin/"
          BINARY=$(find "$CLAUDE_PLUGIN_DATA/bin" -type f -name 'on-event-*' | head -1)
          echo "Downloaded binary: $BINARY"
          if [ -z "$BINARY" ]; then
            echo "::error::No binary found — claude-on-event.sh failed to download"
            exit 1
          fi
          # The cache filename embeds the version. Without this, an empty
          # DASH0_VERSION — a bare dispatch, a dropped plan output, a caller that
          # omits `with:` — silently falls back to the version pinned in the
          # checkout, and this job reports the NEW release as verified having
          # downloaded the previous one.
          if [ -n "${DASH0_VERSION:-}" ] && [[ "$BINARY" != *"$DASH0_VERSION"* ]]; then
            echo "::error::asked for v$DASH0_VERSION but installed $BINARY"
            exit 1
          fi
