# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
project_name: dash0-agent-plugin

version: 2

builds:
  # Releases from here on publish claude-on-event-<os>-<arch>, so all four
  # runtimes use the <runtime>-on-event-<os>-<arch> form. Releases up to and
  # including v0.1.24 carry the unprefixed on-event-<os>-<arch> instead.
  #
  # That split is safe because claude/claude-on-event.sh tries both names and uses
  # the first that resolves, and because each installed script asks its own pinned
  # release, which carries whichever name it was built with. The fallback is what
  # makes the switch possible at all: the Claude marketplace lists this repo with
  # no ref (`{"source": "github", "repo": "dash0hq/dash0-agent-plugin"}`), so
  # install and update take the default branch, pairing the checked-in script with
  # the LAST PUBLISHED release. Renaming without the fallback made every fresh
  # install ask v0.1.24 for a name it does not carry.
  #
  # Drop the on-event-<os>-<arch> candidate from that script once no supported
  # install can still be pinned to v0.1.24 or earlier. See DEVELOPMENT.md#releasing.
  #
  # The local cache filename stays on-event-<version>-<os>-<arch> on purpose:
  # changing it would force every existing install to download again.
  - id: claude-on-event
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/dash0hq/dash0-agent-plugin/internal/version.Version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    dir: ./
    main: ./cmd/claude-on-event
    binary: "claude-on-event-{{ .Os }}-{{ .Arch }}"
    no_unique_dist_dir: true
  - id: cursor-on-event
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/dash0hq/dash0-agent-plugin/internal/version.Version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    dir: ./
    main: ./cmd/cursor-on-event
    binary: "cursor-on-event-{{ .Os }}-{{ .Arch }}"
    no_unique_dist_dir: true
  - id: codex-on-event
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/dash0hq/dash0-agent-plugin/internal/version.Version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    dir: ./
    main: ./cmd/codex-on-event
    binary: "codex-on-event-{{ .Os }}-{{ .Arch }}"
    no_unique_dist_dir: true
  - id: copilot-on-event
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/dash0hq/dash0-agent-plugin/internal/version.Version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    dir: ./
    main: ./cmd/copilot-on-event
    binary: "copilot-on-event-{{ .Os }}-{{ .Arch }}"
    no_unique_dist_dir: true
  - id: opencode-v2-on-event
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/dash0hq/dash0-agent-plugin/internal/version.Version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    dir: ./
    main: ./cmd/opencode-v2-on-event
    binary: "opencode-v2-on-event-{{ .Os }}-{{ .Arch }}"
    no_unique_dist_dir: true

# Developer ID signing and notarization for the darwin binaries, so EDRs such as
# Elastic Defend do not quarantine them (DAR-428). Quill does it from the Linux
# runner; `macos_native` is Pro-only and only handles DMG/pkg. Runs before
# checksums, so checksums.txt hashes the signed binaries.
#
# Off for snapshots (the dry run has no access to the secrets), on for every real
# release: a release without the secrets fails rather than ships unsigned.
#
# One entry per build because GoReleaser signs an entry's binaries one after the
# other but runs entries in parallel (one per CPU), and each waits for Apple's
# verdict. A new build needs its own entry here; the release job fails otherwise.
# Bare Mach-O binaries cannot be stapled; Gatekeeper fetches the ticket online.
notarize:
  macos:
    - &notarize
      enabled: "{{ not .IsSnapshot }}"
      ids: [claude-on-event]
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 15m
    - { <<: *notarize, ids: [cursor-on-event] }
    - { <<: *notarize, ids: [codex-on-event] }
    - { <<: *notarize, ids: [copilot-on-event] }
    - { <<: *notarize, ids: [opencode-v2-on-event] }

archives:
  - formats: ["binary"]
    name_template: "{{ .Binary }}"

checksum:
  name_template: "checksums.txt"

release:
  # Upload into a draft; .github/workflows/release.yml publishes it once every
  # asset is present and verified. GoReleaser creates the release first and then
  # uploads, with checksums.txt last, so publishing at creation leaves a window
  # in which the tag resolves but the binary or its checksum does not. Measured
  # at ~4s on v0.1.24 — small, but every install that lands in it fails, and a
  # draft removes it entirely rather than shrinking it.
  draft: true
  prerelease: auto
  mode: replace

changelog:
  disable: false
