name: CI

on:
  # PRs are the pre-merge gate (and the only safe path for fork PRs). push is
  # scoped to main so trunk is validated post-merge without double-running on
  # every PR-branch push. A branch with no open PR intentionally runs no CI.
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: shellcheck version
        run: shellcheck --version

      - name: Lint
        run: make lint

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate plugin
        run: claude plugin validate .

      - name: Test marketplace install (Dash0 custom, published)
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          claude plugin marketplace add dash0hq/claude-marketplace --scope user
          claude plugin install dash0-agent-plugin@dash0 --scope user

      - name: Test marketplace install (workspace, PR code)
        # Stage the workspace as a local marketplace and install from it. Unlike
        # the published-marketplace step above, this exercises THIS PR's plugin
        # files end-to-end through the marketplace install path — catching
        # regressions in plugin.json, marketplace metadata, or the install flow
        # before they ship to a real marketplace.
        run: |
          mkdir -p /tmp/local-mp/.claude-plugin
          ln -s "$GITHUB_WORKSPACE" /tmp/local-mp/dash0-agent-plugin
          cat > /tmp/local-mp/.claude-plugin/marketplace.json <<'JSON'
          {
            "name": "local",
            "owner": { "name": "ci-local-test" },
            "plugins": [
              { "name": "dash0-agent-plugin", "source": "./dash0-agent-plugin" }
            ]
          }
          JSON
          claude plugin marketplace add /tmp/local-mp --scope user
          claude plugin install dash0-agent-plugin@local --scope user

      - name: Test marketplace install (official, published)
        run: |
          claude plugin marketplace add anthropics/claude-plugins-official --scope user
          claude plugin install dash0@claude-plugins-official --scope user

  # Contract tests pinning behavior that only shows up outside the Go tests, so a
  # CLI change or a wrong doc assumption fails CI rather than a rollout. Logic
  # lives in test/contracts/, also runnable locally — see its README.
  #
  # claude/cursor/codex: one per runtime, covering install, credential delivery
  # and uninstall, i.e. what each runtime README's "Installation" and
  # "Configuration" sections promise.
  # bootstrap: the shared download path in all four *-on-event.sh.
  # release-plan: what a Release dispatch resolves to — that workflow cannot be
  # dispatched from a PR, so this is the only pre-merge coverage it gets.
  #
  # Marketplace installs are covered by the build-and-test job; the binary
  # reading *_PLUGIN_OPTION_AUTH_TOKEN by Go unit tests.
  install-config-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Claude install/config contracts
        run: ./test/contracts/claude.sh

      - name: Cursor install/config contracts
        run: ./test/contracts/cursor.sh

      - name: Codex install/config contracts
        run: ./test/contracts/codex.sh

      - name: Bootstrap download contracts
        run: ./test/contracts/bootstrap.sh

      - name: Release planning contracts
        run: ./test/contracts/release-plan.sh

  e2e:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    # copilot-requests lets the built-in token authenticate the live Copilot
    # canary (TestE2EFullFlowWithCopilot) — no PAT secret needed; it is passed to
    # the test as COPILOT_GITHUB_TOKEN below. Setting a job-level permissions block
    # scopes the token to exactly what this job uses (contents: read for checkout).
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Run E2E tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Enables the live Codex drift canary (TestE2EFullFlowWithCodex), which
          # FAILS when this key is missing (same as the Claude e2e) — so add the
          # secret before merging or the job goes red. Use a Platform service-account
          # key (project codex-o11y, budget-capped); see SIG-172/SIG-174. Inherits
          # this job's fork guard, so a fork PR never receives the secret.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Activates the live Copilot canary (TestE2EFullFlowWithCopilot), which
          # reads COPILOT_GITHUB_TOKEN and FAILS (not skips) when it is empty.
          # No secret: the built-in Actions token authenticates Copilot requests via
          # this job's copilot-requests: write permission. Requires the org to
          # have Copilot enabled for Actions, else this canary goes red. Inherits
          # the fork guard above, so a fork PR never runs it.
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
        run: make test-e2e

  consistency-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version consistency (every pinned version agrees)
        # Previously two hand-written comparisons covering Claude and Cursor,
        # which left the Codex and Copilot manifests and both Copilot-marketplace
        # entries unguarded. scripts/version.sh owns the list, and the release
        # tooling bumps through the same file, so the check and the bump cannot
        # disagree about what needs bumping.
        run: ./scripts/version.sh check

      - name: Codex marketplace consistency (marketplace.json ↔ plugin manifest)
        run: |
          # A Codex marketplace must CONTAIN the plugin via a local path (external
          # github sources are not indexed). Guard against silent breakage: a
          # mismatched name or a non-local/dangling source makes `codex plugin add`
          # fail with a bare "plugin not found" and no other signal.
          MP=.agents/plugins/marketplace.json
          jq empty "$MP"
          MP_NAME=$(jq -r '.plugins[0].name' "$MP")
          MANIFEST_NAME=$(jq -r '.name' .codex-plugin/plugin.json)
          SRC_TYPE=$(jq -r '.plugins[0].source.source' "$MP")
          SRC_PATH=$(jq -r '.plugins[0].source.path' "$MP")
          echo "marketplace: plugin=$MP_NAME source=$SRC_TYPE:$SRC_PATH ; manifest name=$MANIFEST_NAME"
          if [ "$MP_NAME" != "$MANIFEST_NAME" ]; then
            echo "::error::marketplace.json plugin name ($MP_NAME) != .codex-plugin/plugin.json name ($MANIFEST_NAME)"; exit 1
          fi
          if [ "$SRC_TYPE" != "local" ]; then
            echo "::error::Codex plugin source must be 'local' (external sources are not indexed); got '$SRC_TYPE'"; exit 1
          fi
          if [ ! -f "$SRC_PATH/.codex-plugin/plugin.json" ]; then
            echo "::error::source.path '$SRC_PATH' has no .codex-plugin/plugin.json"; exit 1
          fi

      - name: Release assets exist for configured version
        # Warns rather than fails when the release is missing, which is the normal
        # state of a version-bump PR. The Release workflow runs the same script
        # with --strict after publishing, where a missing asset IS the failure.
        run: ./scripts/verify-release-assets.sh "$(jq -r '.version' .claude-plugin/plugin.json)"

      - name: userConfig covers all plugin options
        run: |
          # Extract option keys read in Go code via the harness accessors. The
          # leading letter is matched in both cases, because some accessors are
          # unexported. internal/harness is scanned too: the config is built there,
          # so most keys appear in that file and not at the call site. Only quoted
          # literals match, so generic key parameters contribute nothing.
          USED_KEYS=$(grep -ohE '\.[pP]luginOption(Secure|Bool|BoolDefault)?\("([^"]+)"' \
            cmd/claude-on-event/main.go internal/harness/harness.go | \
            sed 's/.*[pP]luginOption[^"]*"//' | sed 's/"$//' | sort -u)
          # This grep is coupled to how the accessors are spelled, so it has
          # already gone blind twice during refactors. An empty result, or a
          # declared option that no longer appears, means the pattern stopped
          # matching — not that the code is fine. Both fail below.
          if [ -z "$USED_KEYS" ]; then
            echo "::error::No plugin-option keys found — update this grep to match the current accessor names"
            exit 1
          fi
          # Every declared option must be read somewhere, except the two keychain
          # references, which only the bootstrap script reads.
          UNREAD=""
          for key in $(jq -r '.userConfig // {} | keys[]' .claude-plugin/plugin.json); do
            case "$key" in AUTH_TOKEN_KEYCHAIN_ACCOUNT|AUTH_TOKEN_KEYCHAIN_SERVICE) continue ;; esac
            if ! echo "$USED_KEYS" | grep -qx "$key"; then
              UNREAD="$UNREAD $key"
            fi
          done
          if [ -n "$UNREAD" ]; then
            echo "::error::Declared options that no Go code appears to read:$UNREAD (either they are unused, or this grep no longer matches the accessors)"
            exit 1
          fi
          # Extract keys declared in plugin.json userConfig
          DECLARED_KEYS=$(jq -r '.userConfig // {} | keys[]' .claude-plugin/plugin.json | sort -u)
          echo "Used in code: $USED_KEYS"
          echo "Declared in plugin.json: $DECLARED_KEYS"
          MISSING=""
          for key in $USED_KEYS; do
            # Skip DEBUG and DEBUG_FILE — dev-only, not user-facing
            if [ "$key" = "DEBUG" ] || [ "$key" = "DEBUG_FILE" ]; then
              continue
            fi
            if ! echo "$DECLARED_KEYS" | grep -qx "$key"; then
              MISSING="$MISSING $key"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Options used in code but missing from plugin.json userConfig:$MISSING"
            exit 1
          fi

      - name: Runtime component isolation
        run: |
          # Cursor auto-discovers commands/, skills/, and hooks/hooks.json at the
          # repo root when not overridden in .cursor-plugin/plugin.json. Claude
          # auto-discovers skills/ and commands/ at the root. Keep runtime assets
          # under claude/ and cursor/ instead — Claude's own hooks are declared
          # explicitly as claude/hooks.json so a root hooks/ dir never exists.
          fail=0
          for dir in commands skills hooks; do
            if [ -d "$dir" ]; then
              echo "::error::root $dir/ must not exist — move runtime assets under claude/ or cursor/"
              fail=1
            fi
          done
          CURSOR_COMMANDS=$(jq -c '.commands // "unset"' .cursor-plugin/plugin.json)
          CURSOR_SKILLS=$(jq -r '.skills // "unset"' .cursor-plugin/plugin.json)
          CURSOR_HOOKS=$(jq -r '.hooks // "unset"' .cursor-plugin/plugin.json)
          if [ "$CURSOR_COMMANDS" = "unset" ]; then
            echo "::error::.cursor-plugin/plugin.json must set commands (use []) to block auto-discovery"
            fail=1
          fi
          if [ "$CURSOR_SKILLS" != "./cursor/skills/" ]; then
            echo "::error::.cursor-plugin/plugin.json skills must point at ./cursor/skills/ (got $CURSOR_SKILLS)"
            fail=1
          fi
          if [ ! -d "cursor/skills" ]; then
            echo "::error::.cursor-plugin/plugin.json skills references cursor/skills/ but the directory is missing"
            fail=1
          fi
          # Cursor 3.9.x silently ignores `hooks` in local-plugin manifests, so we
          # deliberately omit it. install-cursor.sh reads cursor/hooks.json
          # directly instead. Assert the field is absent so it doesn't sneak back
          # in and mislead future readers.
          if [ "$CURSOR_HOOKS" != "unset" ]; then
            echo "::error::.cursor-plugin/plugin.json must NOT set 'hooks' — Cursor ignores it for local plugins; installer reads cursor/hooks.json directly"
            fail=1
          fi
          if [ ! -f "cursor/hooks.json" ]; then
            echo "::error::cursor/hooks.json is missing (installer reads this file as the source of truth for hook events)"
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "PASS: runtime-specific components are isolated under claude/ and cursor/"

      - name: README documents every userConfig option
        run: |
          # Every userConfig option declared in plugin.json must appear as a
          # table row in the README (the backtick-wrapped `KEY` form), so the
          # Configuration/Privacy tables can't silently fall out of sync.
          DECLARED_KEYS=$(jq -r '.userConfig // {} | keys[]' .claude-plugin/plugin.json | sort -u)
          MISSING=""
          for key in $DECLARED_KEYS; do
            if ! grep -qF "| \`$key\`" .claude-plugin/README.md; then
              MISSING="$MISSING $key"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::userConfig options declared in plugin.json but not documented as README table rows:$MISSING"
            exit 1
          fi
          echo "PASS: README documents all $(echo "$DECLARED_KEYS" | wc -w | tr -d ' ') userConfig options"

      - name: Hook script is valid
        run: |
          # Check claude-on-event.sh is executable and has valid shebang
          if [ ! -x claude/claude-on-event.sh ]; then
            echo "::error::claude/claude-on-event.sh is not executable"
            exit 1
          fi
          HEAD=$(head -1 claude/claude-on-event.sh)
          if [[ "$HEAD" != "#!/"* ]]; then
            echo "::error::claude/claude-on-event.sh missing shebang"
            exit 1
          fi
          # Check hooks.json references an existing script
          # The manifest declares the hooks file explicitly; read it from there
          # so the check follows a future move instead of hardcoding the path.
          HOOKS_FILE=$(jq -r '.hooks' .claude-plugin/plugin.json)
          if [ ! -f "$HOOKS_FILE" ]; then
            echo "::error::.claude-plugin/plugin.json hooks ($HOOKS_FILE) does not exist"
            exit 1
          fi
          HOOK_CMD=$(jq -r '.hooks.SessionStart[0].hooks[0].command' "$HOOKS_FILE")
          EXPECTED='${CLAUDE_PLUGIN_ROOT}/claude/claude-on-event.sh'
          if [ "$HOOK_CMD" != "$EXPECTED" ]; then
            echo "::error::hooks.json command ($HOOK_CMD) does not match expected ($EXPECTED)"
            exit 1
          fi

      - name: Cursor hook script is valid
        run: |
          # Mirror of the Claude hook-script check for the Cursor side. Verifies
          # the bootstrap script is executable, has a shebang, and that every
          # command referenced from cursor/hooks.json resolves to a file
          # relative to the repo root — which is the plugin root Cursor will
          # resolve against when the plugin is dropped into ~/.cursor/plugins/.
          if [ ! -x cursor/cursor-on-event.sh ]; then
            echo "::error::cursor/cursor-on-event.sh is not executable"
            exit 1
          fi
          HEAD=$(head -1 cursor/cursor-on-event.sh)
          if [[ "$HEAD" != "#!/"* ]]; then
            echo "::error::cursor/cursor-on-event.sh missing shebang"
            exit 1
          fi
          COMMANDS=$(jq -r '.hooks | to_entries[] | .value[] | .command' cursor/hooks.json | sort -u)
          if [ -z "$COMMANDS" ]; then
            echo "::error::cursor/hooks.json has no hook commands"
            exit 1
          fi
          fail=0
          for cmd in $COMMANDS; do
            # Resolve relative to the plugin root (repo root here).
            resolved="${cmd#./}"
            if [ ! -f "$resolved" ]; then
              echo "::error::cursor/hooks.json references missing command: $cmd (resolved to $resolved)"
              fail=1
            elif [ ! -x "$resolved" ]; then
              echo "::error::cursor/hooks.json references non-executable command: $cmd"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "PASS: cursor/hooks.json commands all resolve to executable files"
