name: Release

# One button. The workflow bumps the version itself, so there is no prepare step,
# no bump PR and no merge to wait for.
#
# The order matters: main is moved LAST, after the release is published and every
# public download URL has been checked. So main never names a version you cannot
# install — the window where it did was 57s when a merge triggered the build, and
# unbounded before that, when a human pushed the tag.
#
# Pushing to main needs an identity the ruleset lets through. GitHub Actions'
# own token cannot be granted that (GitHub refuses it as a bypass actor with a
# 422), so the Dash0 Release Bot App is used for that one step and nothing else.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Which part to increment, counted from the newest published release.'
        type: choice
        options: [patch, minor, major]
        default: patch
      dry_run:
        description: 'Build and check only — no tag, no release, nothing published.'
        type: boolean
        default: false
      version:
        description: 'Optional: an exact version instead of a bump, e.g. 0.2.0 (no leading v).'
        type: string
        required: false

# The version is not known until the plan job runs, and a job-level `name:`
# renders literally when the job is skipped — which is every dry run. `run-name`
# takes only contexts available at dispatch, so it always resolves.
run-name: ${{ inputs.dry_run && 'Dry run' || 'Release' }} — ${{ inputs.version || inputs.bump }}

concurrency:
  # GoReleaser runs in `mode: replace`, so two runs on one tag delete each
  # other's uploads and leave a partial asset set.
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      bump_needed: ${{ steps.plan.outputs.bump_needed }}
      latest: ${{ steps.plan.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit main pointed at when Release was pressed. Pinned rather
          # than re-resolved, so plan and release cannot see different trees.
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Every file pins the same version
        run: ./scripts/version.sh check

      - name: Resolve what to release
        id: plan
        env:
          # version.sh asks GitHub which releases are published; gh needs a token.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Through env, not interpolation: two of these are free text.
          BUMP: ${{ inputs.bump }}
          DRY_RUN: ${{ inputs.dry_run }}
          IN_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          PLAN=$(./scripts/release-plan.sh)
          printf '%s\n' "$PLAN" | tee -a "$GITHUB_OUTPUT"
          { echo "### Release plan"; echo '```'; printf '%s\n' "$PLAN"; echo '```'; } \
            >>"$GITHUB_STEP_SUMMARY"

  dry-run:
    name: Dry run
    needs: plan
    if: needs.plan.outputs.mode == 'dry-run'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ github.sha }}', fetch-depth: 0 }

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build every artifact without publishing
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: latest
          args: release --snapshot --clean --skip=publish

      - name: The build is complete
        run: |
          set -euo pipefail
          ( cd dist && sha256sum -c checksums.txt )
          ./scripts/expected-artifacts.sh | sort >expected.txt
          find dist -maxdepth 1 -type f -name '*-on-event-*' -exec basename {} \; \
            | sort >built.txt
          diff expected.txt built.txt || { echo "::error::dist is not what .goreleaser.yaml describes"; exit 1; }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ needs.plan.outputs.version }}
          path: |
            dist/*-on-event-*
            dist/checksums.txt
          retention-days: 7

  release:
    needs: plan
    if: needs.plan.outputs.mode == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The App credentials live only in this environment, which is restricted to
    # main. That is the control, not the REF_NAME check in release-plan.sh:
    # workflow_dispatch runs the workflow file from the branch it is dispatched
    # from, so any guard inside the tree is one an attacker also controls.
    # Declaring the environment on a job running elsewhere is rejected before it
    # starts; removing the declaration leaves nothing to read, because these are
    # not repo secrets.
    environment: release
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
      BUMP_NEEDED: ${{ needs.plan.outputs.bump_needed }}
    steps:
      - name: Mint a token for the one push that needs it
        id: app
        # Only when there is a bump to push. Nothing else in this job uses it.
        if: needs.plan.outputs.bump_needed == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Write the version and tag it, locally
        run: |
          set -euo pipefail
          git config user.name "dash0-release-bot[bot]"
          git config user.email "dash0-release-bot[bot]@users.noreply.github.com"
          # bump_needed is false only on the recovery path, where main already
          # carries this version: an earlier run landed the bump and then failed
          # before a release existed.
          if [ "$BUMP_NEEDED" = "true" ]; then
            ./scripts/version.sh set "$VERSION"
            git commit -aqm "release: $TAG"
          fi
          # Local only. Nothing has left the runner yet. A tag that already
          # exists is a re-run of a release that failed after tagging — but only
          # if it points at what we just built. The planner compared it against
          # the pre-bump commit, and HEAD has moved since.
          if ! git tag "$TAG" 2>/dev/null; then
            [ "$(git rev-parse "$TAG^{commit}")" = "$(git rev-parse HEAD)" ] \
              || { echo "::error::tag $TAG exists on a different commit than the one just built"; exit 1; }
            echo "tag $TAG already here — re-run of a release that failed after tagging"
          fi

      - name: Build and upload as a draft
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: The build is complete and the binary runs
        run: |
          set -euo pipefail
          # Still a draft, so nothing here can reach an install. Running the
          # binary catches an artifact that is complete and correctly checksummed
          # but not actually executable on its platform.
          ( cd dist && sha256sum -c checksums.txt )
          ./scripts/expected-artifacts.sh | sort >expected.txt
          find dist -maxdepth 1 -type f -name '*-on-event-*' -exec basename {} \; \
            | sort >built.txt
          diff expected.txt built.txt || { echo "::error::dist is not what .goreleaser.yaml describes"; exit 1; }
          CLAUDE_PLUGIN_DATA=$(mktemp -d) \
          DASH0_OTLP_URL=http://127.0.0.1:1 \
            dist/claude-on-event-linux-amd64 \
            <<<'{"hook_event_name":"SessionStart","session_id":"release-verify","model":"opus"}'

      - name: The draft carries exactly what was built
        run: |
          set -euo pipefail
          # What GitHub actually stored, while it is still unreachable —
          # everything above inspects the local dist/, which says nothing about
          # the upload. By id from the list: GET /releases/tags/{tag} does not
          # return drafts. Newest-first, so take the first match; a leftover
          # draft from an aborted run would otherwise be the one published.
          ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
                 --jq '.[] | select(.tag_name==env.TAG) | .id')
          ID=${ID%%$'\n'*}
          [ -n "$ID" ] || { echo "::error::no release found for $TAG"; exit 1; }
          echo "RELEASE_ID=$ID" >>"$GITHUB_ENV"
          { awk '{print $2}' dist/checksums.txt; echo checksums.txt; } | sort >expected.txt
          gh api "repos/${GITHUB_REPOSITORY}/releases/$ID/assets" --paginate \
            --jq '.[].name' | sort >uploaded.txt
          diff expected.txt uploaded.txt \
            || { echo "::error::the draft's assets do not match the build"; exit 1; }

      - name: Publish
        env:
          MAKE_LATEST: ${{ needs.plan.outputs.latest }}
        run: |
          set -euo pipefail
          git push origin "$TAG"
          # draft is a boolean (-F); make_latest is a string enum (-f).
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false -f make_latest="$MAKE_LATEST" >/dev/null
          echo "Published https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" \
            >>"$GITHUB_STEP_SUMMARY"

      - name: Every bootstrap resolves a binary at its public URL
        run: |
          set -euo pipefail
          # Retried: the release stopped being a draft seconds ago, and the
          # download host does not always serve it on the first ask. Failing
          # here leaves a published release nobody can install, so a transient
          # 404 must not be reported as one.
          # Three attempts, not five: this loop only covers propagation lag,
          # which resolves in seconds. A 429 or a 5xx is retried inside the
          # script against its own deadline, so the total wait here is bounded
          # well under the job's 20-minute timeout — being killed by that after
          # Publish is the worst outcome available.
          for attempt in 1 2 3; do
            if ./scripts/verify-release-assets.sh --strict "$VERSION"; then exit 0; fi
            echo "attempt $attempt did not resolve every asset; retrying"
            sleep $((attempt * 10))
          done
          echo "::error::the published assets never became reachable"
          exit 1

      - name: Move main to the new version
        if: needs.plan.outputs.bump_needed == 'true'
        run: |
          set -euo pipefail
          # Last, so main never names a version whose assets are not downloadable
          # yet. The cost is that this is the one step that can be rejected by
          # someone else merging, and by now the release is public: a lost race
          # leaves v$VERSION published while main still pins the old version.
          # The planner refuses to cut anything in that state and says to land
          # the bump as a PR, so the version cannot be silently skipped.
          #
          # A plain push, not --force: it is still a compare-and-swap, and the
          # App's ruleset bypass does not weaken a non-fast-forward rejection.
          #
          # actions/checkout persists its own credential as an http.extraheader,
          # which git sends on every request to github.com whatever the remote
          # URL says. Left in place it can win over the userinfo below, making
          # this push GITHUB_TOKEN's — which the ruleset rejects, and the error
          # would look exactly like a lost race. Removed so the identity is
          # unambiguous. `|| true` because --unset-all exits 5 when the key is
          # absent, which is a valid state, not a failure.
          git config --unset-all "http.https://github.com/.extraheader" 2>/dev/null || true
          # The App's identity, for this one command. Everything else in this
          # job — building, drafting, publishing — uses GITHUB_TOKEN.
          git remote set-url origin \
            "https://x-access-token:${{ steps.app.outputs.token }}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git push origin HEAD:main; then
            echo "::error::v${VERSION} IS PUBLISHED but main could not be moved," \
                 "so main still pins the previous version. Usually main moved during" \
                 "this run; if it repeats, check that the App is still a bypass actor" \
                 "on the branch ruleset. Fix by opening a PR that runs" \
                 "./scripts/version.sh set ${VERSION} and merging it — do not delete" \
                 "the release, installs may already have taken it."
            exit 1
          fi

      # Reached when any step above failed. Publish patches draft=false as its
      # final act, so a release still marked draft here never became reachable —
      # the failure was at or before Publish. It is only in the way of the
      # re-run: the asset diff takes the newest draft for the tag, and a stale
      # one would be it. A failure AFTER Publish leaves a published release,
      # which this deliberately does not touch.
      - name: Remove the draft this run left behind
        # cancelled() as well as failure(): a cancelled run leaves the draft
        # exactly as a failed one does, and `failure()` alone does not fire for
        # it. Not `always()` — on success the release is published, and the
        # guard below would be the only thing standing between that and a
        # delete.
        if: failure() || cancelled()
        run: |
          set -euo pipefail
          # Looked up by tag, not from RELEASE_ID. That variable is only written
          # after the asset diff, so keying on it missed the likeliest failure of
          # all: GoReleaser creates the release and then uploads, so a failure
          # part-way through the upload leaves a draft that the guard could not
          # see. Which is exactly the leftover the "newest draft for this tag"
          # pick further up exists to survive.
          ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
                 --jq '.[] | select(.tag_name==env.TAG and .draft) | .id' 2>/dev/null | head -1) || true
          if [ -n "$ID" ]; then
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/$ID"
            echo "deleted the draft for $TAG"
            # Publish pushes the tag and then flips the draft; if it died between
            # the two, the tag is on this run's bump commit — which is not on
            # main and, since the bump is pushed last, never will be. Left
            # behind it wedges the release permanently: the planner refuses
            # every future run with "tag already exists on another commit", and
            # so does the local `git tag` guard, because the next run builds a
            # different bump commit. It goes with the draft, both being remains
            # of a release that never happened. The `if` because the tag is not
            # pushed on most failure paths, and a 422 there is not an error.
            if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" 2>/dev/null; then
              echo "deleted $TAG, which pointed at a commit that never reached main"
            fi
          else
            echo "no draft for $TAG — either none was created, or it is published and stays"
          fi

  # Everything above proves the assets resolve and the binary we built runs. This
  # proves the path a user actually takes: the bootstrap downloading the
  # published release, verifying its checksum, and exporting a span. It was a
  # separate workflow reached by workflow_call; folding it in removes the
  # indirection and — more usefully — removes the way it could pass having
  # verified the wrong thing. VERSION comes from the plan, so there is no input
  # to arrive empty and silently fall back to whatever the checkout pins.
  verify:
    name: Verify the published release installs
    needs: [plan, release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DASH0_VERSION: ${{ needs.plan.outputs.version }}
      CLAUDE_PLUGIN_DATA: /tmp/e2e-plugin-data
      DASH0_OTLP_URL: http://localhost:4319
      CLAUDE_PLUGIN_OPTION_OTLP_URL: http://localhost:4319
      CLAUDE_PLUGIN_OPTION_AUTH_TOKEN: e2e-release-test-token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ github.sha }}' }

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Start a mock collector
        run: |
          make build-binary PKG=./test/e2e/mock-otlp-server OUT=/tmp/mock-otlp
          /tmp/mock-otlp &
          sleep 1

      - name: Install the published release through the bootstrap, and drive a turn
        run: |
          set -euo pipefail
          mkdir -p "$CLAUDE_PLUGIN_DATA"
          for e in \
            '{"hook_event_name":"SessionStart","session_id":"e2e","model":"opus"}' \
            '{"hook_event_name":"UserPromptSubmit","session_id":"e2e","prompt":"hello"}' \
            '{"hook_event_name":"PostToolUse","session_id":"e2e","tool_name":"Bash","tool_use_id":"tu1","duration_ms":100}' \
            '{"hook_event_name":"Stop","session_id":"e2e","model":"opus","stop_reason":"end_turn"}'
          do
            echo "$e" | bash claude/claude-on-event.sh
          done

      - name: It installed the version under test, not the one pinned in the checkout
        run: |
          set -euo pipefail
          # Exact, not a substring: 0.1.2 would otherwise be satisfied by
          # on-event-0.1.25-linux-amd64. And unconditional — the guard this
          # replaces only fired when DASH0_VERSION was already set, which is the
          # one case where the fallback cannot happen.
          [ -n "$DASH0_VERSION" ] || { echo "::error::no version to verify against"; exit 1; }
          want="on-event-${DASH0_VERSION}-linux-amd64"
          ls -la "$CLAUDE_PLUGIN_DATA/bin/"
          [ -x "$CLAUDE_PLUGIN_DATA/bin/$want" ] \
            || { echo "::error::expected $want in the cache; the bootstrap installed something else"; exit 1; }

      - name: The collector received the spans
        run: |
          set -euo pipefail
          sleep 2
          RESULT=$(curl -s http://localhost:4319/requests)
          echo "$RESULT" | jq .
          COUNT=$(echo "$RESULT" | jq '.count')
          [ "$COUNT" -ge 3 ] \
            || { echo "::error::expected at least 3 requests, got $COUNT"; exit 1; }
          AUTH=$(echo "$RESULT" | jq '[.requests[] | select(.auth == "Bearer e2e-release-test-token")] | length')
          [ "$AUTH" -ge 1 ] || { echo "::error::no request carried the auth header"; exit 1; }
