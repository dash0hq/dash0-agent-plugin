name: CI

on:
  # PRs are the pre-merge gate, and the only safe path for fork PRs. A branch
  # with no open PR intentionally runs no CI.
  #
  # There is deliberately no `push: branches: [main]`. It ran 60 times between
  # 14 July and 31 August and caught nothing — its one red run was a GitHub API
  # rate limit — while spending four minutes and a live Claude, Codex and
  # Copilot canary on every merge, twice over since the Windows matrix landed.
  # Everything it ran had already run on the PR.
  #
  # What it covered in principle is a PR merged on a stale base, since the
  # ruleset sets strict_required_status_checks_policy: false. If that matters,
  # the fix is to require the checks and turn strict on, not to observe trunk
  # after the fact.
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Shellcheck
        run: make shellcheck-lint

      - name: Lint
        run: make golangci-lint

      - name: Lint (GOOS=windows)
        run: GOOS=windows make golangci-lint

      - name: Lint (GOOS=darwin)
        run: GOOS=darwin make golangci-lint

      - name: go-version-check
        run: make go-version-check

      - name: Diagnostic scripts
        run: make test-scripts

  build-test:
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            test-flags: -race -coverprofile=cover.out
          - os: windows-latest
            test-flags: -timeout=20m
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ${{ matrix.test-flags }} ./...

  # Marketplace install paths. Linux-only: they drive the real Claude Code CLI
  # through three install routes, which is a property of the marketplaces and
  # the CLI, not of the host OS.
  marketplace-install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate plugin
        run: claude plugin validate .

      - name: Test marketplace install (Dash0 custom, published)
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          claude plugin marketplace add dash0hq/claude-marketplace --scope user
          claude plugin install dash0-agent-plugin@dash0 --scope user

      - name: Test marketplace install (workspace, PR code)
        # Stage the workspace as a local marketplace and install from it. Unlike
        # the published-marketplace step above, this exercises THIS PR's plugin
        # files end-to-end through the marketplace install path — catching
        # regressions in plugin.json, marketplace metadata, or the install flow
        # before they ship to a real marketplace.
        run: |
          mkdir -p /tmp/local-mp/.claude-plugin
          ln -s "$GITHUB_WORKSPACE" /tmp/local-mp/dash0-agent-plugin
          cat > /tmp/local-mp/.claude-plugin/marketplace.json <<'JSON'
          {
            "name": "local",
            "owner": { "name": "ci-local-test" },
            "plugins": [
              { "name": "dash0-agent-plugin", "source": "./dash0-agent-plugin" }
            ]
          }
          JSON
          claude plugin marketplace add /tmp/local-mp --scope user
          claude plugin install dash0-agent-plugin@local --scope user

      - name: Test marketplace install (official, published)
        run: |
          claude plugin marketplace add anthropics/claude-plugins-official --scope user
          claude plugin install dash0@claude-plugins-official --scope user

  # Contract tests mapping to the documented install/credential/uninstall paths
  # (each runtime README's "Installation" + "Configuration"). They pin the
  # behavior the docs depend on, so a CLI change or a wrong doc assumption fails
  # CI, not a rollout. Logic lives in test/contracts/{claude,cursor,codex}.sh
  # (also runnable locally — see test/contracts/README.md), one script per agent.
  # Each covers install, credential delivery, and uninstall for its runtime.
  # Marketplace installs are covered by the marketplace-install job; the binary
  # reading *_PLUGIN_OPTION_AUTH_TOKEN by Go unit tests.
  install-config-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Claude install/config contracts
        run: ./test/contracts/claude.sh

      - name: Cursor install/config contracts
        run: ./test/contracts/cursor.sh

      - name: Codex install/config contracts
        run: ./test/contracts/codex.sh

      - name: Bootstrap download contracts
        run: ./test/contracts/bootstrap.sh

  # Runs on Windows as well as Linux. build-test already covers windows-latest,
  # but only with `go test ./...` — no -tags=e2e — so nothing in test/e2e was
  # ever compiled, let alone run, on Windows. That is where the whole class of
  # Windows bugs lived: extensionless binaries the OS refuses to exec, raw
  # backslash paths interpolated into event JSON, HOME set without USERPROFILE,
  # and hook registrations naming a shell variant Windows never selects. A
  # build-tagged test file that does not even compile on Windows (SysProcAttr's
  # Setpgid) also slips past a plain `go build ./...`.
  #
  # Note this doubles the live canaries: the Claude, Codex and Copilot runs each
  # spend real budget once per OS.
  e2e:
    runs-on: ${{ matrix.os }}
    strategy:
      # Report both platforms on a failure rather than cancelling the sibling —
      # a Windows-only break should not hide the Linux result, or vice versa.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            test-cmd: make test-e2e
          # GNU make is not part of the windows-latest image contract, so invoke
          # the same command `make test-e2e` wraps. The longer timeout is for the
          # runner, not the suite: the three live canaries are slower here.
          - os: windows-latest
            test-cmd: go test -tags=e2e -v -timeout=600s ./test/e2e/
    # Skipped for fork PRs. They get no secrets, so the three live canaries would fail
    # on missing credentials rather than on anything real. The `push` half of
    # this condition went with the main-push trigger; a manual dispatch needs to
    # reach the canaries, which an inverted pull_request test allows and the old
    # form did not.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # copilot-requests lets the built-in token authenticate the live Copilot
    # canary (TestE2EFullFlowWithCopilot) — no PAT secret needed; it is passed to
    # the test as COPILOT_GITHUB_TOKEN below. Setting a job-level permissions block
    # scopes the token to exactly what this job uses (contents: read for checkout).
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Run E2E tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Enables the live Codex drift canary (TestE2EFullFlowWithCodex), which
          # FAILS when this key is missing (same as the Claude e2e) — so add the
          # secret before merging or the job goes red. Use a Platform service-account
          # key (project codex-o11y, budget-capped); see SIG-172/SIG-174. Inherits
          # this job's fork guard, so a fork PR never receives the secret.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Activates the live Copilot canary (TestE2EFullFlowWithCopilot), which
          # reads COPILOT_GITHUB_TOKEN and FAILS (not skips) when it is empty.
          # No secret: the built-in Actions token authenticates Copilot requests via
          # this job's copilot-requests: write permission. Requires the org to
          # have Copilot enabled for Actions, else this canary goes red. Inherits
          # the fork guard above, so a fork PR never runs it.
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
        # shell: bash on both. The Windows default is PowerShell, and the tests
        # shell out to `bash` for the .sh bootstraps regardless; Git Bash ships
        # with the windows-latest image and is what supplies it.
        shell: bash
        run: ${{ matrix.test-cmd }}

  release-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version consistency (every pinned version agrees)
        # Was two hand-written comparisons covering Claude and Cursor, leaving the
        # Codex and Copilot manifests and both marketplace entries unguarded.
        # scripts/version.sh owns the list, and the release workflow bumps through
        # the same file, so the check and the bump cannot disagree.
        run: ./scripts/version.sh check

      - name: Release planning contracts
        # Here rather than with the install contracts: this is about the version
        # pins and the release plan, needs no npm and no Go, and takes 3s. The
        # release workflow cannot be dispatched from a PR, so these contracts are
        # the only pre-merge coverage its branching gets.
        run: ./test/contracts/release.sh

      - name: Release assets exist for configured version
        # Warns rather than fails when the release is missing — the Release
        # workflow runs the same script with --strict after publishing, where a
        # missing asset IS the failure.
        run: ./scripts/verify-release-assets.sh "$(jq -r '.version' .claude-plugin/plugin.json)"

  # The one required status check. Everything above is required through this
  # rather than by name, because most of the names cannot be relied on: the
  # matrix jobs report as `build-test (ubuntu-latest, -race -coverprofile=…)`,
  # so editing a flag renames the check, the ruleset waits forever for a context
  # nobody produces, and every PR in the repo blocks until someone notices.
  #
  # Adding a job to CI now makes it blocking by adding it to `needs`, in this
  # file, in the same PR — instead of in a ruleset nobody reads.
  gate:
    name: All checks passed
    # always(), or a failed dependency skips this and the ruleset sees a missing
    # context rather than a failure.
    if: always()
    needs: [checks, build-test, marketplace-install, install-config-contract, e2e, release-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job this gates succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS" | jq -r 'to_entries[] | "  \(.value.result)\t\(.key)"'
          # `skipped` passes: e2e is deliberately skipped for fork PRs, which get
          # no secrets and could only fail the live canaries on missing
          # credentials. `failure` and `cancelled` do not.
          if echo "$RESULTS" | jq -e 'to_entries[] | select(.value.result != "success" and .value.result != "skipped")' >/dev/null; then
            echo "::error::a gated job did not pass"
            exit 1
          fi
