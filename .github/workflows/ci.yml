name: CI

on:
  # PRs are the pre-merge gate, and the only safe path for fork PRs. A branch
  # with no open PR intentionally runs no CI.
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Lint
        run: make lint

      - name: Lint (GOOS=windows)
        run: GOOS=windows make golangci-lint

      - name: Lint (GOOS=darwin)
        run: GOOS=darwin make golangci-lint

      - name: Diagnostic scripts
        run: make test-scripts

  build-test:
    # Named explicitly, so the status-check context is the job and the platform and
    # nothing else. A matrix job with no name embeds every matrix value, and editing
    # a flag or a timeout then renames a required check.
    name: build-test (${{ matrix.os }})
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            test-flags: -race -coverprofile=cover.out
          # macOS carries coverage no other leg compiles:
          # internal/harness/keychain_darwin_test.go is darwin-tagged, and the
          # `shasum -a 256` fallback in four bootstraps and two installers is
          # unreachable where sha256sum exists.
          - os: macos-latest
            test-flags: -race
          - os: windows-latest
            test-flags: -timeout=20m
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ${{ matrix.test-flags }} ./...

  # A real agent CLI installing the plugin from the in-repo marketplaces. Needs
  # the CLIs but NO credentials and no LLM turn, so unlike the e2e job it runs on
  # fork PRs too.
  marketplaces:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Plugin install via each marketplace
        run: make test-marketplaces

  # A live turn on both platforms. The canaries drive each CLI's real terminal
  # REPL (a pty on Linux, a ConPTY on Windows).
  #
  # Note this doubles the live canaries: the Claude, Codex and Copilot runs each
  # spend real budget once per OS.
  e2e:
    name: e2e (${{ matrix.os }})
    # Gated on checks, because these turns cost real budget on two platforms. A PR
    # that cannot pass `make lint` should not spend six canaries finding that out.
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      # Report both platforms on a failure rather than cancelling the sibling —
      # a Windows-only break should not hide the Linux result, or vice versa.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            test-cmd: make test-e2e
          # GNU make is not part of the windows-latest image contract, so invoke
          # the same command `make test-e2e` wraps, with the same timeout.
          - os: windows-latest
            test-cmd: go test -tags=e2e -v -timeout=2700s ./test/e2e/
    # Skipped for fork PRs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Run E2E tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: ${{ matrix.test-cmd }}

  release-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Release planning contracts
        # The release workflow cannot be dispatched from a PR, so these
        # contracts are the only pre-merge coverage its branching gets. Shell,
        # because what they drive is shell: no npm, no Go, three seconds.
        run: ./test/contracts/release.sh

      - name: Release assets exist for configured version
        # Warns rather than fails when the release is missing — the Release
        # workflow runs the same script with --strict after publishing, where a
        # missing asset IS the failure. The one check with no Go counterpart:
        # TestBootstrapsFetchTheAssetTheReleasePublishes derives the names from
        # .goreleaser.yaml, but only a request can say whether they are served.
        run: ./scripts/verify-release-assets.sh "$(jq -r '.version' .claude-plugin/plugin.json)"
