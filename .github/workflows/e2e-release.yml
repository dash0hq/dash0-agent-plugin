name: E2E Release Verification

# Runs after a release is published. Exercises the download path the CI job
# cannot: scripts/on-event.sh fetches the real binary from GitHub Releases,
# verifies its checksum, and runs a turn of hook events through it. That makes
# this the only check that the asset name the script builds matches what
# GoReleaser actually published.
#
# Does NOT run on push to main — the binary won't exist until a release is cut.
# Use workflow_dispatch for manual testing.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  e2e-release:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Git Bash on Windows — the interpreter the hook actually gets there.
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Bootstrap script downloads the released binary
        env:
          DASH0_E2E_RELEASE_DOWNLOAD: "1"
        run: go test -tags=e2e -v -timeout=180s -run TestBootstrapScriptDownloadsReleasedBinary ./test/e2e/
