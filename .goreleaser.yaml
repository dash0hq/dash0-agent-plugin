# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
project_name: on-event

version: 2

builds:
  # The Claude Code binary is published as `on-event-<os>-<arch>`, without the
  # `claude-` prefix the other runtimes use. That asset name is baked into every
  # already-installed claude-on-event.sh bootstrap, so it stays as it is even
  # though the Go package is cmd/claude-on-event.
  - id: claude-on-event
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/dash0hq/dash0-agent-plugin/internal/version.Version={{.Version}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    dir: ./
    main: ./cmd/claude-on-event
    binary: "on-event-{{ .Os }}-{{ .Arch }}"
    no_unique_dist_dir: true
  - id: cursor-on-event
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/dash0hq/dash0-agent-plugin/internal/version.Version={{.Version}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    dir: ./
    main: ./cmd/cursor-on-event
    binary: "cursor-on-event-{{ .Os }}-{{ .Arch }}"
    no_unique_dist_dir: true
  - id: codex-on-event
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/dash0hq/dash0-agent-plugin/internal/version.Version={{.Version}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    dir: ./
    main: ./cmd/codex-on-event
    binary: "codex-on-event-{{ .Os }}-{{ .Arch }}"
    no_unique_dist_dir: true
  - id: copilot-on-event
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/dash0hq/dash0-agent-plugin/internal/version.Version={{.Version}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    dir: ./
    main: ./cmd/copilot-on-event
    binary: "copilot-on-event-{{ .Os }}-{{ .Arch }}"
    no_unique_dist_dir: true

archives:
  - formats: ["binary"]
    name_template: "{{ .Binary }}"

checksum:
  name_template: "checksums.txt"

release:
  prerelease: auto
  mode: replace

changelog:
  disable: false
